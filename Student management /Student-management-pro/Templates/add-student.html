<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Add Student - StudentPro</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
    </head>

    <body class="dashboard-page">
        <!-- SIDEBAR -->

        <aside class="sidebar">
            <div class="logo">Student<span>Pro</span></div>

            <nav>
                <a href="/dashboard"> Dashboard </a>

                <a href="/students"> Students </a>

                <a href="/add-student" class="active"> Add Student </a>
            </nav>

            <a href="/logout" class="logout"> Logout </a>
        </aside>

        <!-- MAIN CONTENT -->

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h1>Add Student</h1>

                    <p>Add a new student to the system.</p>
                </div>

                <div class="profile">{{ session["username"][0]|upper }}</div>
            </header>

            <!-- FORM CARD -->

            <div class="form-card">
                <form method="POST">
                    <div class="form-grid">
                        <!-- NAME -->

                        <div class="form-group">
                            <label> Student Name </label>

                            <input
                                type="text"
                                name="name"
                                placeholder="Enter student name"
                                required
                            />
                        </div>

                        <!-- AGE -->

                        <div class="form-group">
                            <label> Age </label>

                            <input
                                type="number"
                                name="age"
                                placeholder="Enter age"
                                min="1"
                                max="100"
                                required
                            />
                        </div>

                        <!-- CLASS -->

                        <div class="form-group">
                            <label> Class </label>

                            <input
                                type="text"
                                name="class_name"
                                placeholder="Example: Class 10"
                                required
                            />
                        </div>

                        <!-- CITY -->

                        <div class="form-group">
                            <label> City </label>

                            <input
                                type="text"
                                name="city"
                                placeholder="Enter city"
                                required
                            />
                        </div>

                        <!-- PHONE -->

                        <div class="form-group">
                            <label> Phone Number </label>

                            <input
                                type="tel"
                                name="phone"
                                placeholder="Enter phone number"
                                required
                            />
                        </div>
                    </div>
                    <div class="form-actions">
                        <a href="/students" class="cancel-button"> Cancel </a>
                        <button type="submit">Add Student</button>
                    </div>
                </form>
            </div>
        </main>
    </body>
</html>
