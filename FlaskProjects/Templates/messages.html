<!DOCTYPE html>
<html>

<head>
    <title>Messages</title>
    <link href="{{url_for('static', filename='css/style-messages.css')}}" rel="stylesheet">
</head>

<body>
    <h1>Messages</h1>
    <table border="3px groove orange">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Messages</th>
        </tr>
        {% for message in messages %}
        <tr>
            <td>{{ message[0] }}</td>
            <td>{{ message[1] }}</td>
            <td>{{ message[2] }}</td>
            <td>{{ message[3] }}</td>
            <td>{{ message[4] }}</td>
            <td><a href="/delete/{{message[0]}}">Delete </a></td>
            <td><a href="/edit/{{message[0]}}">Edit</a></td>
        </tr>
        {% endfor %}

    </table>
</body>

</html>
