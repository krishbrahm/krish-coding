<!DOCTYPE html>
<html>

<head>
    <title>Edit Messages</title>
</head>

<body>
    <h1>Edit Message</h1>
    <form method="POST">
        <input type="text" name="name" value="{{ message[1] }}" required>
        <br><br>
        <input type="email" name="email" value="{{ message[2] }}" required>
        <br><br>
        <input type="number" name="age" value="{{ message[3] }}" required>
        <br><br>
        <textarea name="message" required>{{ message[4] }}</textarea>
        <br><br>
        <button type="submit">Update</button>
    </form>
</body>

</html>
