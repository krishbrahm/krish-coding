<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            text-align: center;
            margin-top: 120px;
            font-family: Arial, sans-serif;
        }

        #searchBox {
            width: 500px;
            height: 40px;
            border: 1px solid black;
            padding-left: 15px;
            font-size: 16px;
            border-radius: 20px;
        }

        #searchBox:focus {
            outline: none;
            box-shadow: 0 0 5px rgb(212, 242, 212);
        }

        #searchButton {
            margin: 10px;
            padding: 10px 20px;
            border: 1px solid transparent;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        #searchButton:hover {
            border: 1px solid #c6c6c6;
        }
    </style>
</head>

<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6U4pRN-hmnCKRp
    5bBpsxjHfbbutWDEgFRUo0YrTP2ag&s=10" alt="Google logo">
    <br> <br>
    <input placeholder="Search Google..." type="search" id="searchBox">
    <br> <br>
    <button id="searchButton" ; onclick="searchGoogle()">Google Search</button>
    <script src="script.js">
    </script>
</body>

</html>
