<!DOCTYPE html>
<html>

<head>
    <title>Shopping online</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Grocery List</h1>

    <p id="count">Selected Items: 0</p>

    <form>

        <input type="checkbox" id="apples" value="Apples">
        <label for="apples">Apples</label>

        <input type="checkbox" id="eggs" value="Eggs">
        <label for="eggs">Eggs</label>

        <input type="checkbox" id="tomatoes" value="Tomatoes">
        <label for="tomatoes">Tomatoes</label>

        <br>

        <input type="checkbox" id="carrots" value="Carrots">
        <label for="carrots">Carrots</label>

        <input type="checkbox" id="milk" value="Milk">
        <label for="milk">Milk</label>

        <input type="checkbox" id="potatoes" value="Potatoes">
        <label for="potatoes">Potatoes</label>

        <br>

        <input type="checkbox" id="lettuce" value="Lettuce">
        <label for="lettuce">Lettuce</label>

        <input type="checkbox" id="watermealon" value="Watermealon">
        <label for="watermealon">watermealon</label>

        <input type="checkbox" id="noodles" value="Noodles">
        <label for="noodles">Noodles</label>

        <br>

        <input type="checkbox" id="banana" value="Banana">
        <label for="banana">Banana</label>

        <input type="checkbox" id="pork" value="Pork">
        <label for="pork">Pork</label>

        <input type="checkbox" id="radish" value="Radish">
        <label for="radish">Radish</label>

        <br>

        <input type="checkbox" id="grapes" value="Grapes">
        <label for="grapes">Grapes</label>

        <input type="checkbox" id="meat" value="Meat">
        <label for="meat">Meat</label>

        <input type="checkbox" id="chicken" value="Chicken">
        <label for="chicken">Chicken</label>

        <br><br>

        <button type="button" onclick="sendList()">
            Send Grocery List
        </button>

    </form>
    <script src="script.js"></script>
</body>

</html>
